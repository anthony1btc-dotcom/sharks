<title>The Sharks Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080600;--card:#0f0c01;--gold:#c9a84c;--gold2:#f0c040;--gd:rgba(201,168,76,.1);--gb:rgba(201,168,76,.22);--green:#00e676;--grd:rgba(0,230,118,.1);--red:#ff3d5a;--rdd:rgba(255,61,90,.1);--t1:#f0e6c8;--t2:#a08840;--t3:#5a4820;--b2:#2a2000;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{color:var(--t1);font-family:Inter,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:Inter,sans-serif;outline:none;border:none;}
img{display:block;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes barW{from{width:0}to{width:100%}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(201,168,76,.25)}50%{box-shadow:0 0 50px rgba(201,168,76,.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:float 4s ease-in-out infinite;}
.pulse{animation:pulse 2s ease infinite;}
.gold-text{background:linear-gradient(135deg,#8b6914,#f0c040,#c9a84c,#ffd700);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
.screen{position:fixed;inset:0;display:none;z-index:10;}
.screen.on{display:flex;}
#SL{background:radial-gradient(ellipse at 50% 30%,#1e1500,#080600);flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.sl-logo{width:120px;height:120px;border-radius:24px;margin-bottom:18px;animation:glow 2s ease-in-out infinite,float 4s ease-in-out infinite;}
.sl-bar{width:150px;height:2px;background:var(--b2);border-radius:1px;overflow:hidden;margin-top:20px;}
.sl-fill{height:100%;background:linear-gradient(90deg,#8b6914,#ffd700,#c9a84c);border-radius:1px;animation:barW 3s ease forwards;}
#SA{background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.07),transparent 50%),var(--bg);align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.ab{width:100%;max-width:420px;background:linear-gradient(160deg,#111000,#080600);border:1px solid var(--gb);border-radius:24px;padding:32px 24px;box-shadow:0 40px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,215,0,.06);animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;}
.al{width:88px;height:88px;border-radius:18px;margin:0 auto 12px;display:block;animation:glow 3s ease-in-out infinite;}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:11px;color:var(--t1);font-size:14px;padding:12px 14px;width:100%;transition:all .25s;margin-bottom:10px;}
.inp:focus{border-color:var(--gold);background:rgba(201,168,76,.05);}
.inp::placeholder{color:var(--t3);}
.tabrow{display:flex;gap:3px;background:#120e03;border-radius:12px;padding:4px;margin-bottom:20px;border:1px solid var(--b2);}
.tabb{flex:1;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;padding:9px;transition:all .3s;color:var(--t3);}
.tabb.on{background:linear-gradient(135deg,#7a5c10,#c9a84c);color:#000;}
.abtn{background:linear-gradient(135deg,#7a5c10,#c9a84c,#f0c040);border:none;border-radius:12px;color:#000;cursor:pointer;font-weight:700;font-size:14px;padding:14px;width:100%;transition:all .3s;font-family:Cinzel,serif;letter-spacing:1px;box-shadow:0 6px 20px rgba(201,168,76,.3);}
.abtn:disabled{opacity:.5;cursor:not-allowed;}
.fgot{display:block;text-align:right;color:var(--gold);font-size:12px;cursor:pointer;margin-bottom:14px;margin-top:-4px;background:none;}
.amsg{border-radius:10px;font-size:13px;padding:10px 14px;margin-bottom:12px;display:none;}
.aerr{background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.3);color:#ff8a9a;}
.aok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:var(--green);}
#APP{flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{height:calc(56px + var(--st));background:rgba(8,6,0,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--gb);padding:var(--st) 16px 0;flex-shrink:0;}
.tbi{display:flex;align-items:center;justify-content:space-between;height:56px;}
.brand{display:flex;align-items:center;gap:9px;}
.bl{width:30px;height:30px;border-radius:6px;}
.bn{font-family:Cinzel,serif;font-size:14px;font-weight:700;letter-spacing:2px;}
.bs{color:var(--t3);font-size:7px;letter-spacing:2px;display:block;margin-top:-2px;}
.tr2{display:flex;align-items:center;gap:8px;}
.aib{background:rgba(201,168,76,.1);border:1px solid var(--gb);border-radius:20px;color:var(--gold2);cursor:pointer;font-size:10px;font-weight:700;padding:6px 12px;font-family:Cinzel,serif;}
.uav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7a5c10,#c9a84c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#000;cursor:pointer;border:2px solid var(--gb);font-family:Cinzel,serif;}
.acb{padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(201,168,76,.08);background:rgba(8,6,0,.5);flex-shrink:0;}
.acb::-webkit-scrollbar{display:none;}
.apill{flex-shrink:0;border-radius:20px 0 0 20px;cursor:pointer;font-size:10px;font-weight:700;padding:6px 8px 6px 14px;transition:all .25s;font-family:Cinzel,serif;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--t3);white-space:nowrap;}
.apill.on{background:linear-gradient(135deg,#7a5c10,#c9a84c);border-color:var(--gold);color:#000;}
.adelbtn{flex-shrink:0;border-radius:0 20px 20px 0;cursor:pointer;font-size:9px;padding:6px 8px;transition:all .25s;font-family:Cinzel,serif;border:1px solid var(--b2);border-left:none;background:rgba(255,255,255,.04);color:var(--t3);white-space:nowrap;}
.adelbtn.on{background:rgba(201,168,76,.35);border-color:var(--gold);color:#000;}
.aadd{flex-shrink:0;border-radius:20px;cursor:pointer;font-size:10px;padding:6px 12px;border:1px dashed var(--gb);background:transparent;color:var(--t3);font-family:Cinzel,serif;white-space:nowrap;}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:74px;}
.vt{padding:8px 16px 6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.vt::-webkit-scrollbar{display:none;}
.vb{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:18px;color:var(--t3);cursor:pointer;font-size:10px;font-weight:700;padding:6px 14px;transition:all .25s;font-family:Cinzel,serif;}
.vb.on{background:linear-gradient(135deg,#7a5c10,#c9a84c);border-color:var(--gold);color:#000;}
.banner{margin:0 16px 12px;background:linear-gradient(145deg,#111000,#080600);border:1px solid var(--gb);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;}
.banner::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);}
.bl2{color:var(--t3);font-size:8px;letter-spacing:3px;text-transform:uppercase;margin-bottom:2px;font-family:Cinzel,serif;}
.bp{font-family:Cinzel,serif;font-size:34px;letter-spacing:1px;line-height:1.1;font-weight:900;}
.gt{height:4px;background:var(--b2);border-radius:2px;overflow:hidden;margin-bottom:10px;}
.gf{height:100%;background:linear-gradient(90deg,#7a5c10,#ffd700);border-radius:2px;transition:width 1.5s cubic-bezier(.16,1,.3,1);}
.bst{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px;}
.bss{background:rgba(255,255,255,.03);border:1px solid var(--b2);border-radius:9px;padding:8px 9px;}
.bsv{font-family:Cinzel,serif;font-size:16px;font-weight:700;}
.bsl{color:var(--t3);font-size:7px;letter-spacing:2px;margin-top:1px;text-transform:uppercase;}
.tlt{border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border:1px solid;margin:0 16px 12px;}
.phw{padding:0 16px;margin-bottom:12px;}
.pht{font-family:Cinzel,serif;font-size:8px;letter-spacing:4px;color:var(--gold);margin-bottom:7px;text-transform:uppercase;}
.phg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.ph{background:var(--card);border:1px solid var(--b2);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;position:relative;transition:all .25s;}
.ph.done{border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.05);}
.ph.cur{border-color:var(--gb);background:var(--gd);}
.phc{position:absolute;top:3px;right:5px;color:var(--green);font-size:8px;font-weight:700;}
.phm{font-family:Cinzel,serif;font-size:7px;letter-spacing:2px;color:var(--t3);margin-bottom:2px;text-transform:uppercase;}
.pha{font-family:Cinzel,serif;font-size:11px;font-weight:700;margin-bottom:1px;}
.phb{height:2px;background:var(--b2);border-radius:1px;margin-top:4px;overflow:hidden;}
.phf{height:100%;border-radius:1px;transition:width .8s ease;}
.nr{display:flex;align-items:center;justify-content:space-between;padding:5px 16px 8px;}
.nl{font-family:Cinzel,serif;font-size:17px;letter-spacing:3px;font-weight:700;}
.nb2{background:rgba(255,255,255,.05);border:1px solid var(--b2);border-radius:8px;color:var(--t2);cursor:pointer;font-size:14px;padding:5px 11px;}
.yg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 16px;}
.mc{background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:10px;cursor:pointer;transition:all .25s;}
.mc:hover{border-color:var(--gb);transform:translateY(-2px);}
.mn{font-family:Cinzel,serif;font-size:11px;letter-spacing:2px;color:var(--t2);margin-bottom:5px;}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px;}
.dot{width:100%;aspect-ratio:1;border-radius:2px;}
.de{background:rgba(255,255,255,.05);}.dw{background:var(--green);}.dl{background:var(--red);}
.mp{font-family:Cinzel,serif;font-size:12px;font-weight:700;}
.ch{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 16px;margin-bottom:3px;}
.chl{text-align:center;color:var(--t3);font-size:8px;letter-spacing:1px;padding:3px 0;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px;}
.cd{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1px solid transparent;gap:2px;transition:transform .15s;}
.cd:hover{transform:scale(1.07);}
.cde{cursor:default;}
.cdw{background:var(--grd);border-color:rgba(0,230,118,.2);}.cdl{background:var(--rdd);border-color:rgba(255,61,90,.2);}.cdt{border-color:var(--gold)!important;}
.cnum{font-size:10px;color:var(--t3);font-family:"Space Mono",monospace;}
.cdot{width:5px;height:5px;border-radius:50%;}
.cpnl{font-size:7px;font-family:"Space Mono",monospace;font-weight:700;}
.d3{padding:0 16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
.d3c{aspect-ratio:1;border-radius:7px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.stt{font-family:Cinzel,serif;font-size:8px;letter-spacing:4px;color:var(--gold);padding:0 16px;margin-bottom:7px;margin-top:12px;text-transform:uppercase;}
.tl{padding:0 16px;display:flex;flex-direction:column;gap:6px;}
.tc{background:var(--card);border:1px solid var(--b2);border-left:3px solid transparent;border-radius:12px;padding:11px 13px;cursor:pointer;transition:all .2s;}
.tc.win{border-left-color:var(--green);}.tc.loss{border-left-color:var(--red);}
.tc:hover{border-color:var(--gb);}
.tt{display:flex;justify-content:space-between;align-items:flex-start;}
.tp{font-family:Cinzel,serif;font-size:15px;font-weight:700;}
.tpnl{font-family:Cinzel,serif;font-size:16px;font-weight:700;}
.chip{border-radius:5px;font-size:8px;font-weight:700;letter-spacing:1px;padding:2px 6px;text-transform:uppercase;}
.cl{background:var(--grd);color:var(--green);}.cs{background:var(--rdd);color:var(--red);}.cg2{background:var(--gd);color:var(--gold2);}
.botnav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,6,0,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--gb);display:flex;justify-content:space-around;padding:8px 0;padding-bottom:calc(8px + var(--sb));z-index:50;}
.nb{align-items:center;background:none;border:none;color:var(--t3);cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:7px;letter-spacing:1px;padding:4px 8px;transition:all .2s;font-family:Cinzel,serif;position:relative;}
.nb.on{color:var(--gold2);}
.nb.on::before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--gold2);border-radius:0 0 2px 2px;}
.nb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;}
.nb.on svg{transform:scale(1.1);}
.ag{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:0 16px;margin-bottom:10px;}
.ac{background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:13px;}
.av{font-family:Cinzel,serif;font-size:22px;font-weight:700;margin-top:2px;}
.al2{color:var(--t3);font-size:8px;letter-spacing:3px;text-transform:uppercase;}
.ec{margin:0 16px 10px;background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:13px;}
.edgec{background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:13px;margin-bottom:8px;}
.rc{margin:0 16px 9px;background:var(--card);border:1px solid var(--gb);border-radius:12px;padding:14px;position:relative;overflow:hidden;}
.rc::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);}
.rr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.rl{color:var(--t3);font-size:9px;letter-spacing:2px;font-family:Cinzel,serif;text-transform:uppercase;}
.rv{font-family:Cinzel,serif;font-size:13px;font-weight:700;color:var(--gold2);}
.sc{margin:0 16px 9px;background:var(--card);border:1px solid var(--b2);border-radius:12px;padding:14px;}
.sl2{color:var(--gold2);font-size:10px;font-weight:700;margin-bottom:10px;font-family:Cinzel,serif;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.db{margin:0 16px 10px;border-radius:12px;padding:12px 14px;border:1px solid;}

.sht{font-family:Cinzel,serif;font-size:20px;letter-spacing:2px;margin-bottom:14px;font-weight:700;}
.shd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.shc{background:rgba(255,255,255,.06);border:none;border-radius:8px;color:var(--t2);cursor:pointer;font-size:15px;padding:6px 10px;}
.fl{color:var(--t3);font-size:8px;letter-spacing:3px;text-transform:uppercase;display:block;margin-bottom:4px;font-family:Cinzel,serif;}
.fg2{margin-bottom:10px;}
.fi{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:10px;color:var(--t1);font-size:14px;padding:10px 12px;width:100%;transition:all .25s;}
.fi:focus{border-color:var(--gold);}

select.fi option{background:#0f0c01;}
textarea.fi{resize:vertical;min-height:65px;line-height:1.6;}
.fpnl{font-family:Cinzel,serif;font-size:26px;letter-spacing:2px;text-align:center;padding:12px;font-weight:900;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.eg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;}
.eb{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:8px;color:var(--t2);cursor:pointer;font-size:10px;padding:7px 3px;text-align:center;transition:all .25s;}
.eb.on{border-color:var(--gold);background:var(--gd);color:var(--gold2);}
.mg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.mb{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:6px;color:var(--t2);cursor:pointer;font-size:9px;padding:5px 8px;transition:all .25s;font-family:Cinzel,serif;}
.mb.on{border-color:var(--red);background:var(--rdd);color:var(--red);}
.pr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.pa{width:60px;height:60px;border-radius:10px;border:2px dashed var(--gb);background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--gold);flex-shrink:0;}
.pt{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--b2);cursor:pointer;flex-shrink:0;}
.bm{background:linear-gradient(135deg,#7a5c10,#c9a84c,#f0c040);border:none;border-radius:11px;color:#000;cursor:pointer;font-weight:700;font-size:13px;padding:13px;width:100%;transition:all .25s;font-family:Cinzel,serif;letter-spacing:1px;}
.bm:disabled{opacity:.5;cursor:not-allowed;}
.bg{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:9px;color:var(--t2);cursor:pointer;font-size:11px;padding:8px 13px;transition:all .2s;font-family:Cinzel,serif;}
.bg:hover{border-color:var(--gold);color:var(--gold);}
.bd{background:var(--rdd);border:1px solid rgba(255,61,90,.25);border-radius:7px;color:var(--red);cursor:pointer;font-size:10px;padding:4px 8px;}
.be{background:var(--gd);border:1px solid var(--gb);border-radius:7px;color:var(--gold2);cursor:pointer;font-size:10px;padding:4px 8px;}
.dt2{background:#0a0800;border:1px solid var(--b2);border-left:3px solid transparent;border-radius:11px;padding:12px;margin-bottom:7px;}
.dt2.win{border-left-color:var(--green);}.dt2.loss{border-left-color:var(--red);}
.ao2{white-space:pre-wrap;line-height:1.85;font-size:13px;color:var(--t1);}
.pav{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#7a5c10,#c9a84c);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:26px;font-weight:900;color:#000;margin:0 auto 10px;border:3px solid var(--gb);}
#TOAST{position:fixed;top:12px;left:50%;transform:translateX(-50%) translateY(-80px);background:#111000;border:1px solid var(--gb);border-radius:12px;color:var(--t1);font-size:13px;padding:8px 16px;z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;font-family:Cinzel,serif;}
#TOAST.on{transform:translateX(-50%) translateY(0);}
#LBX{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;align-items:center;justify-content:center;z-index:999;cursor:zoom-out;}
#LBX img{max-width:96vw;max-height:96vh;border-radius:10px;}
.spin{width:28px;height:28px;border:2px solid var(--b2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
@media(min-width:600px){.yg{grid-template-columns:repeat(4,1fr);}.ag{grid-template-columns:repeat(3,1fr);}.phg{grid-template-columns:repeat(6,1fr);}}

function dk(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fd(y,m){return new Date(y,m,1).getDay();}
function fS(n){const v=Number(n||0);return(v>=0?"$":"-$")+Math.abs(v).toFixed(2);}
function fP(n){return Number(n||0).toFixed(1)+"%";}
function tDay(k){return trades.filter(t=>t.fecha===k);}
function pDay(k){return tDay(k).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tMo(y,m){let a=[];for(let i=1;i<=dim(y,m);i++)a=a.concat(tDay(dk(y,m,i)));return a;}
function pMo(y,m){return tMo(y,m).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tYr(y){let a=[];for(let m=0;m<12;m++)a=a.concat(tMo(y,m));return a;}
function last30(){const r=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d.getFullYear(),d.getMonth(),d.getDate());r.push({key:k,pnl:pDay(k),trs:tDay(k)});}return r;}

function calcS(arr){
  const t=arr.filter(x=>x.pnl!==undefined&&x.pnl!==null&&x.pnl!=="");
  if(!t.length)return{total:0,wins:0,losses:0,wr:0,pnl:0,avgW:0,avgL:0,rr:0,best:0,worst:0,pf:0,dd:0,exp:0,consec:0};
  const W=t.filter(x=>Number(x.pnl)>0),L=t.filter(x=>Number(x.pnl)<0);
  const pnl=t.reduce((s,x)=>s+Number(x.pnl),0);
  const gW=W.reduce((s,x)=>s+Number(x.pnl),0),gL=Math.abs(L.reduce((s,x)=>s+Number(x.pnl),0));
  const avgW=W.length?gW/W.length:0,avgL=L.length?gL/L.length:0;
  const wr=t.length?W.length/t.length:0,exp=(wr*avgW)-((1-wr)*avgL);
  let peak=0,dd=0,run=0,consec=0,cur=0;
  t.forEach(x=>{run+=Number(x.pnl);if(run>peak)peak=run;const dr=peak-run;if(dr>dd)dd=dr;if(Number(x.pnl)>0){cur=cur>=0?cur+1:1;}else{cur=cur<=0?cur-1:-1;}if(Math.abs(cur)>Math.abs(consec))consec=cur;});
  return{total:t.length,wins:W.length,losses:L.length,wr:wr*100,pnl,avgW,avgL,rr:avgL?avgW/avgL:0,best:Math.max(...t.map(x=>Number(x.pnl))),worst:Math.min(...t.map(x=>Number(x.pnl))),pf:gL?gW/gL:0,dd,exp,consec};
}

function getTilt(){
  const r=trades.slice(0,10);if(!r.length)return{score:0,state:"Enfocado",color:"var(--green)",pct:0};
  const s=Math.min(10,(r.filter(t=>Number(t.pnl)<0).length*0.5)+(r.filter(t=>t.emocion==="revenge"||t.emocion==="fomo").length*1.5)+(r.filter(t=>t.mistakes&&t.mistakes.length>0).length*0.8));
  if(s<=2)return{score:s,state:"Enfocado",color:"var(--green)",pct:s*10};
  if(s<=5)return{score:s,state:"Precaucion",color:"var(--gold)",pct:s*10};
  if(s<=8)return{score:s,state:"En Tilt",color:"#ff9800",pct:s*10};
  return{score:s,state:"PARA YA",color:"var(--red)",pct:100};
}

function compressImg(file,maxKB){
  maxKB=maxKB||350;
  return new Promise(function(res){
    const r=new FileReader();
    r.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement("canvas");
        let w=img.width,h=img.height,m=1400;
        if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m;}else{w=Math.round(w*m/h);h=m;}}
        c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.85,out=c.toDataURL("image/jpeg",q);
        while(out.length>maxKB*1024&&q>0.3){q-=0.08;out=c.toDataURL("image/jpeg",q);}
        res(out);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}

window.confirmDelAccount=function(id,name){
  if(accounts.length<=1){toast('No puedes borrar la unica cuenta','var(--red)');return;}
  if(!confirm('Borrar cuenta "'+name+'"?\n\nSe eliminaran todos sus trades.\nNo se puede deshacer.'))return;

  getDocs(query(collection(db,'trades'),where('uid','==',CU.uid),where('accId','==',id))).then(function(snap){
    var dels=snap.docs.map(function(d){return deleteDoc(doc(db,'trades',d.id));});

function subTrades(){

  const q=query(collection(db,"trades"),where("uid","==",CU.uid),where("accId","==",curAccId));

    trades=snap.docs.map(function(d){return Object.assign({},d.data(),{fid:d.id});});
    trades.sort(function(a,b){return(b.fecha||"").localeCompare(a.fecha||"");});
    render();

  }else{

// JOURNAL
function buildJou(){
  const acc=curAcc();
  let cards="";
  trades.forEach(function(t){
    const p=Number(t.pnl||0),rM=acc&&acc.capital&&acc.riskPct?(p/(acc.capital*acc.riskPct/100)).toFixed(1):"";
    let card='<div class="tc '+(p>=0?"win":"loss")+'" onclick="openDay(\''+(t.fecha||"")+'\')">';
    card+='<div class="tt"><div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">';

    card+='<span class="tp">'+(t.par||"—")+'</span>';
    if(t.mercado)card+='<span class="chip cg2">'+t.mercado+'</span>';
    if(rM)card+='<span style="font-size:9px;color:'+(p>=0?"var(--green)":"var(--red)")+';font-family:\'Space Mono\',monospace;font-weight:700">'+(p>=0?"+":"")+rM+'R</span>';
    card+='</div><span class="tpnl" style="color:'+(p>=0?"var(--green)":"var(--red)")+'">'+fS(p)+'</span></div>';
    if(t.setup||t.sesion)card+='<div style="color:var(--gold);font-size:9px;margin-top:3px;font-family:Cinzel,serif;letter-spacing:1px">'+(t.setup||"")+( t.sesion?" · "+t.sesion:"")+'</div>';
    card+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px">';
    card+='<span style="color:var(--t3);font-size:10px;font-family:\'Space Mono\',monospace">'+(t.fecha||"")+'</span>';

  const eq=[0];sorted.forEach(function(t){eq.push(eq[eq.length-1]+Number(t.pnl||0));});
  const minE=Math.min(...eq),maxE=Math.max(...eq),rng=maxE-minE||1;
  const pts=eq.map(function(v,i){return(i/(eq.length-1||1)*300)+","+(100-((v-minE)/rng)*90);}).join(" ");
  const setupS={},sesS={},mktS={},mstS={};
  trades.forEach(function(t){
    if(t.setup){if(!setupS[t.setup])setupS[t.setup]={n:0,p:0,w:0};setupS[t.setup].n++;setupS[t.setup].p+=Number(t.pnl||0);if(Number(t.pnl)>0)setupS[t.setup].w++;}
    if(t.sesion){if(!sesS[t.sesion])sesS[t.sesion]={n:0,p:0};sesS[t.sesion].n++;sesS[t.sesion].p+=Number(t.pnl||0);}
    if(t.mercado){if(!mktS[t.mercado])mktS[t.mercado]={n:0,p:0,w:0};mktS[t.mercado].n++;mktS[t.mercado].p+=Number(t.pnl||0);if(Number(t.pnl)>0)mktS[t.mercado].w++;}
    if(t.mistakes)t.mistakes.forEach(function(m){if(!mstS[m])mstS[m]=0;mstS[m]++;});
  });
  const bS=Object.entries(setupS).sort(function(a,b){return b[1].p-a[1].p;})[0];
  const wS=Object.entries(setupS).sort(function(a,b){return a[1].p-b[1].p;})[0];
  const bSes=Object.entries(sesS).sort(function(a,b){return b[1].p-a[1].p;})[0];

    html+='<polygon points="0,100 '+pts+' '+(eq.length-1)/(eq.length-1||1)*300+',100" fill="url(#eg)"/>';
    html+='<polyline points="'+pts+'" fill="none" stroke="'+(ys.pnl>=0?"#00e676":"#ff3d5a")+'" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
    html+='<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-top:5px;font-family:\'Space Mono\',monospace"><span>MIN: '+fS(minE)+'</span><span>MAX: '+fS(maxE)+'</span></div></div>';
  }

  if(bS||bSes||bM){

    if(bM)html+='<div class="edgec"><div class="al2" style="margin-bottom:4px">MEJOR MERCADO</div><div style="font-family:Cinzel,serif;font-size:15px;font-weight:700;color:var(--gold2)">'+bM[0]+'</div><div style="color:var(--t3);font-size:10px;margin-top:2px">'+bM[1].n+' trades · '+fS(bM[1].p)+'</div></div>';

    html+='</div>';
  }
  html+=sR("30 DIAS",[["P&L",fS(ds.pnl),ds.pnl>=0?"var(--green)":"var(--red)"],["WIN RATE",fP(ds.wr),ds.wr>=50?"var(--green)":"var(--gold)"],["TRADES",ds.total,"var(--t1)"],["R/R",ds.rr.toFixed(2),ds.rr>=1.5?"var(--green)":ds.rr>=1?"var(--gold)":"var(--red)"],["EXPECTANCY",fS(ds.exp),ds.exp>=0?"var(--green)":"var(--red)"],["MAX DD",fS(ds.dd),"var(--red)"]]);

window.openTradeForm=function(day,existing){
  selDay=day||( existing&&existing.fecha)||TODAY;
  editFid=(existing&&existing.fid)||null;
  formPhotos=existing&&existing.photos?[...existing.photos]:[];
  selMistakes=existing&&existing.mistakes?[...existing.mistakes]:[];
  selEmo=(existing&&existing.emocion)||"neutral";

  function rf(){
    const pv=(existing&&existing.pnl)||"";
    const pc=Number(pv)>0?"var(--green)":Number(pv)<0?"var(--red)":"var(--t1)";
    let form='<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sh"><div class="shh"></div>';
    form+='<div class="shd"><div class="sht">'+(editFid?"EDITAR":"NUEVO")+' TRADE <span style="color:var(--t3);font-size:12px;font-weight:400;font-family:Inter"> · '+selDay+'</span></div><button class="shc" onclick="closeModal()">✕</button></div>';
    form+='<div class="fg2"><label class="fl">P&L $</label><input class="fi fpnl" id="FP" type="number" step="0.01" placeholder="+125.50 o -80.00" value="'+pv+'" style="color:'+pc+'" oninput="this.style.color=Number(this.value)>0?\'var(--green)\':Number(this.value)<0?\'var(--red)\':\'var(--t1)\'"/></div>';
    form+='<div class="g2"><div><label class="fl">PAR</label><input class="fi" id="FPAR" type="text" placeholder="BTC/USDT, EUR/USD..." value="'+((existing&&existing.par)||"")+'"/></div><div><label class="fl">MERCADO</label><select class="fi" id="FMKT">';
    MRKTS.forEach(function(m){form+='<option value="'+m+'" '+(existing&&existing.mercado===m?"selected":"")+'>'+m+'</option>';});
    form+='</select></div></div>';
    form+='<div class="g2"><div><label class="fl">DIRECCION</label><select class="fi" id="FDIR"><option value="LONG" '+((!existing||existing.dir==="LONG")?"selected":"")+'>LONG</option><option value="SHORT" '+(existing&&existing.dir==="SHORT"?"selected":"")+'>SHORT</option></select></div><div><label class="fl">SESION</label><select class="fi" id="FSES">';
    SESSIONS.forEach(function(s){form+='<option value="'+s+'" '+(existing&&existing.sesion===s?"selected":"")+'>'+s+'</option>';});
    form+='</select></div></div>';
    form+='<div class="fg2"><label class="fl">SETUP</label><select class="fi" id="FSET">';
    SETUPS.forEach(function(s){form+='<option value="'+s+'" '+(existing&&existing.setup===s?"selected":"")+'>'+s+'</option>';});
    form+='</select></div>';
    form+='<div class="g3"><div><label class="fl">ENTRADA</label><input class="fi" id="FENT" type="number" step="any" placeholder="0.00" value="'+((existing&&existing.entrada)||"")+'"/></div><div><label class="fl">SL</label><input class="fi" id="FSL" type="number" step="any" placeholder="0.00" value="'+((existing&&existing.sl)||"")+'"/></div><div><label class="fl">TP</label><input class="fi" id="FTP" type="number" step="any" placeholder="0.00" value="'+((existing&&existing.tp)||"")+'"/></div></div>';
    form+='<div class="fg2"><label class="fl">EMOCION</label><div class="eg">';
    EMOS.forEach(function(em){form+='<button type="button" class="eb'+(selEmo===em.v?" on":"")+'" onclick="pickE(\''+em.v+'\',this)">'+em.e+' '+em.l+'</button>';});
    form+='</div><input type="hidden" id="FEMO" value="'+selEmo+'"/></div>';
    form+='<div class="fg2"><label class="fl">ERRORES</label><div class="mg">';
    MISTAKES.forEach(function(m){form+='<button type="button" class="mb'+(selMistakes.indexOf(m)>=0?" on":"")+'" onclick="toggleMst(\''+m+'\',this)">'+m+'</button>';});
    form+='</div></div>';
    form+='<div class="fg2"><label class="fl">NOTAS</label><textarea class="fi" id="FNOTES" placeholder="Setup, gestion, lecciones...">'+(( existing&&existing.notas)||"")+'</textarea></div>';
    form+='<div class="fg2"><label class="fl">FOTOS</label><div class="pr" id="PROW">';
    formPhotos.forEach(function(ph,i){form+='<div style="position:relative;flex-shrink:0"><img loading="lazy" src="'+ph+'" class="pt" onclick="openLB(\''+ph+'\')"/><button type="button" onclick="rmP('+i+')" style="position:absolute;top:-6px;right:-6px;background:var(--red);border:none;border-radius:50%;color:#fff;cursor:pointer;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1">✕</button></div>';});
    form+='<label class="pa"><span style="font-size:18px">📷</span><span style="font-size:8px;font-family:Cinzel,serif;letter-spacing:1px">FOTO</span><input type="file" accept="image/*" multiple style="display:none" onchange="addP(this)"/></label></div></div>';
    form+='<button type="button" class="bm" id="BSV" onclick="doSave()">'+(editFid?"ACTUALIZAR":"GUARDAR TRADE")+'</button></div></div>';
    showM(form);
  }

  window.pickE=function(v,btn){selEmo=v;const fi=G("FEMO");if(fi)fi.value=v;document.querySelectorAll(".eb").forEach(function(b){b.classList.remove("on");});btn.classList.add("on");};
  window.toggleMst=function(m,btn){const i=selMistakes.indexOf(m);if(i>=0){selMistakes.splice(i,1);btn.classList.remove("on");}else{selMistakes.push(m);btn.classList.add("on");}};
  window.rmP=function(i){formPhotos.splice(i,1);rf();};
  window.addP=async function(input){
    const files=Array.from(input.files);
    for(let i=0;i<files.length;i++){
      try{
        toast("Comprimiendo foto...");
        const c=await compressImg(files[i],350);
        formPhotos.push(c);
        const row=G("PROW");
        if(row){
          const idx=formPhotos.length-1;
          const w=document.createElement("div");w.style="position:relative;flex-shrink:0";
          w.innerHTML='<img loading="lazy" src="'+c+'" class="pt" onclick="openLB(this.src)"/><button type="button" onclick="rmP('+idx+')" style="position:absolute;top:-6px;right:-6px;background:var(--red);border:none;border-radius:50%;color:#fff;cursor:pointer;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1">✕</button>';
          row.insertBefore(w,row.lastElementChild);
        }
        toast("Foto agregada");
      }catch(e){toast("Error con la foto","var(--red)");}
    }
  };
  window.doSave=async function(){
    const pnl=G("FP")&&G("FP").value,par=(G("FPAR")&&G("FPAR").value||"").trim();
    const dir=G("FDIR")&&G("FDIR").value||"LONG",mercado=G("FMKT")&&G("FMKT").value||"";
    const sesion=G("FSES")&&G("FSES").value||"",setup=G("FSET")&&G("FSET").value||"";
    const entrada=G("FENT")&&G("FENT").value||"",sl=G("FSL")&&G("FSL").value||"",tp=G("FTP")&&G("FTP").value||"";
    const emocion=G("FEMO")&&G("FEMO").value||"neutral",notas=(G("FNOTES")&&G("FNOTES").value||"").trim();
    if(!pnl&&!par){toast("Ingresa P&L o par","var(--gold)");return;}
    const btn=G("BSV");if(btn){btn.disabled=true;btn.textContent="Guardando...";}
    try{
      await saveTrade({fecha:selDay,pnl:pnl?Number(pnl):0,par,dir,mercado,sesion,setup,entrada:entrada?Number(entrada):0,sl:sl?Number(sl):0,tp:tp?Number(tp):0,emocion,notas,mistakes:[...selMistakes],photos:[...formPhotos],fid:editFid});
      closeM();
    }catch(e){
      toast("Error: "+e.message,"var(--red)");
      if(btn){btn.disabled=false;btn.textContent=editFid?"ACTUALIZAR":"GUARDAR TRADE";}
    }
  };
  rf();
};
