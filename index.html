<title>Sharks Asset Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0800;--card:#161200;
  --gold:#c9a84c;--gold2:#f0c040;
  --gd:rgba(201,168,76,.1);--gb:rgba(201,168,76,.22);
  --green:#00e676;--red:#ff4d6a;--rdd:rgba(255,77,106,.1);
  --t1:#f8f0d8;--t2:#c8a84c;--t3:#7a6040;--b2:#221a00;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --cr:18px;--cp:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{color:var(--t1);font-family:Inter,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:Inter,sans-serif;outline:none;border:none;}
img{display:block;}
::-webkit-scrollbar{width:2px;}::-webkit-scrollbar-thumb{background:var(--b2);}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes barW{from{width:0}to{width:100%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes gridScroll{from{transform:translateY(0)}to{transform:translateY(80px)}}
.float{animation:float 4s ease-in-out infinite;}
.gold-text{background:linear-gradient(135deg,#b08828,#f0c040,#c9a84c,#ffd700,#c9a84c);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.grid-bg::before{content:"";position:absolute;inset:-80px;background-image:linear-gradient(rgba(201,168,76,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.055) 1px,transparent 1px);background-size:48px 48px;}
.grid-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -5%,rgba(201,168,76,.18) 0%,transparent 45%),radial-gradient(ellipse at 0% 100%,rgba(201,168,76,.06) 0%,transparent 35%);}
.screen{position:fixed;inset:0;display:none;z-index:10;}.screen.on{display:flex;}
#SL{background:var(--bg);flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.sl-ring{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;}
.sl-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(201,168,76,.15);}
.sl-ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold2);animation:spin 2s linear infinite;}
.sl-logo{width:115px;height:115px;border-radius:24px;box-shadow:0 0 50px rgba(201,168,76,.4);animation:float 3s ease-in-out infinite;}
.sl-bar{width:180px;height:1px;background:var(--b2);border-radius:1px;overflow:hidden;margin-top:28px;}
.sl-fill{height:100%;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);animation:barW 3s ease forwards;}
#SA{background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.15),transparent 50%),var(--bg);align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.ab{width:100%;max-width:420px;background:linear-gradient(155deg,rgba(201,168,76,.08),rgba(0,0,0,.8));border:1px solid var(--gb);border-radius:28px;padding:40px 30px;box-shadow:0 60px 120px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,215,0,.1);animation:fadeUp .5s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;}
.ab::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);}
.al{width:90px;height:90px;border-radius:22px;margin:0 auto 16px;display:block;box-shadow:0 0 40px rgba(201,168,76,.35);}
.inp{background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.2);border-radius:14px;color:var(--t1);font-size:15px;padding:14px 16px;width:100%;transition:all .3s;margin-bottom:10px;}
.inp:focus{border-color:var(--gold);background:rgba(201,168,76,.07);box-shadow:0 0 0 3px rgba(201,168,76,.08);}
.inp::placeholder{color:var(--t3);}
.tabrow{display:flex;gap:3px;background:rgba(0,0,0,.4);border-radius:14px;padding:4px;margin-bottom:24px;border:1px solid var(--b2);}
.tabb{flex:1;border:none;background:transparent;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;padding:11px;transition:all .3s;color:var(--t3);}
.tabb.on{background:linear-gradient(135deg,#6a4a08,#c9a84c);color:#000;font-weight:800;}
.abtn{background:linear-gradient(135deg,#6a4a08,#c9a84c,#f0c040);border:none;border-radius:14px;color:#000;cursor:pointer;font-weight:800;font-size:14px;padding:16px;width:100%;font-family:Cinzel,serif;letter-spacing:2px;box-shadow:0 8px 32px rgba(201,168,76,.4);transition:all .3s;}
.abtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 48px rgba(201,168,76,.6);}
.abtn:disabled{opacity:.5;cursor:not-allowed;}
.fgot{display:block;text-align:right;color:var(--gold2);font-size:12px;cursor:pointer;margin-bottom:16px;background:none;}
.amsg{border-radius:12px;font-size:13px;padding:12px 16px;margin-bottom:12px;display:none;}
.aerr{background:rgba(255,77,106,.1);border:1px solid rgba(255,77,106,.3);color:#ff8a9a;}
.aok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:var(--green);}
#APP{flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{height:calc(58px + var(--st));background:rgba(10,8,0,.97);border-bottom:1px solid rgba(201,168,76,.18);padding:var(--st) 18px 0;flex-shrink:0;position:relative;}
.topbar::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.5),transparent);}
.tbi{display:flex;align-items:center;justify-content:space-between;height:58px;}
.brand{display:flex;align-items:center;gap:11px;}
.bl{width:32px;height:32px;border-radius:9px;box-shadow:0 0 14px rgba(201,168,76,.25);}
.bn{font-family:Cinzel,serif;font-size:13px;font-weight:900;letter-spacing:3px;}
.bs{color:var(--t3);font-size:7px;letter-spacing:4px;display:block;}
.tr2{display:flex;align-items:center;gap:8px;}
.aib{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);border-radius:22px;color:var(--gold2);cursor:pointer;font-size:9px;font-weight:700;padding:8px 15px;font-family:Cinzel,serif;letter-spacing:1px;transition:all .25s;}
.aib:hover{background:rgba(201,168,76,.22);border-color:var(--gold);}
.uav{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6a4a08,#c9a84c);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000;cursor:pointer;font-family:Cinzel,serif;box-shadow:0 0 16px rgba(201,168,76,.25);}
.acb{padding:8px 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:rgba(10,8,0,.6);border-bottom:1px solid rgba(201,168,76,.1);}
.acb::-webkit-scrollbar{display:none;}
.apill{flex-shrink:0;border-radius:22px 0 0 22px;cursor:pointer;font-size:9px;font-weight:700;padding:7px 9px 7px 15px;font-family:Cinzel,serif;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--t3);white-space:nowrap;transition:all .2s;}

function dk(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fd(y,m){return new Date(y,m,1).getDay();}
function fS(n){const v=Number(n||0);return(v>=0?"$":"-$")+Math.abs(v).toFixed(2);}
function fP(n){return Number(n||0).toFixed(1)+"%";}
function tDay(k){return trades.filter(t=>t.fecha===k);}
function pDay(k){return tDay(k).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tMo(y,m){let a=[];for(let i=1;i<=dim(y,m);i++)a=a.concat(tDay(dk(y,m,i)));return a;}
function pMo(y,m){return tMo(y,m).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tYr(y){let a=[];for(let m=0;m<12;m++)a=a.concat(tMo(y,m));return a;}
function last30(){const r=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d.getFullYear(),d.getMonth(),d.getDate());r.push({key:k,pnl:pDay(k),trs:tDay(k)});}return r;}

function calcS(arr){
  const t=arr.filter(x=>x.pnl!==undefined&&x.pnl!==null&&x.pnl!=="");
  if(!t.length)return{total:0,wins:0,losses:0,wr:0,pnl:0,avgW:0,avgL:0,rr:0,best:0,worst:0,pf:0,dd:0,exp:0,consec:0};
  const W=t.filter(x=>Number(x.pnl)>0),L=t.filter(x=>Number(x.pnl)<0);
  const pnl=t.reduce((s,x)=>s+Number(x.pnl),0);
  const gW=W.reduce((s,x)=>s+Number(x.pnl),0),gL=Math.abs(L.reduce((s,x)=>s+Number(x.pnl),0));
  const avgW=W.length?gW/W.length:0,avgL=L.length?gL/L.length:0;
  const wr=t.length?W.length/t.length:0,exp=(wr*avgW)-((1-wr)*avgL);
  let peak=0,dd=0,run=0,consec=0,cur=0;
  t.forEach(x=>{run+=Number(x.pnl);if(run>peak)peak=run;const dr=peak-run;if(dr>dd)dd=dr;if(Number(x.pnl)>0){cur=cur>=0?cur+1:1;}else{cur=cur<=0?cur-1:-1;}if(Math.abs(cur)>Math.abs(consec))consec=cur;});
  return{total:t.length,wins:W.length,losses:L.length,wr:wr*100,pnl,avgW,avgL,rr:avgL?avgW/avgL:0,best:Math.max(...t.map(x=>Number(x.pnl))),worst:Math.min(...t.map(x=>Number(x.pnl))),pf:gL?gW/gL:0,dd,exp,consec};
}

function getTilt(){
  const r=trades.slice(0,10);if(!r.length)return{score:0,state:"Enfocado",color:"var(--green)",pct:0};
  const s=Math.min(10,(r.filter(t=>Number(t.pnl)<0).length*0.5)+(r.filter(t=>t.emocion==="revenge"||t.emocion==="fomo").length*1.5)+(r.filter(t=>t.mistakes&&t.mistakes.length>0).length*0.8));
  if(s<=2)return{score:s,state:"Enfocado",color:"var(--green)",pct:s*10};
  if(s<=5)return{score:s,state:"Precaucion",color:"var(--gold)",pct:s*10};
  if(s<=8)return{score:s,state:"En Tilt",color:"#ff9800",pct:s*10};
  return{score:s,state:"PARA YA",color:"var(--red)",pct:100};
}

function compressImg(file,maxKB){
  maxKB=maxKB||350;
  return new Promise(function(res){
    const r=new FileReader();
    r.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement("canvas");
        let w=img.width,h=img.height,m=1400;
        if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m;}else{w=Math.round(w*m/h);h=m;}}
        c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.85,out=c.toDataURL("image/jpeg",q);
        while(out.length>maxKB*1024&&q>0.3){q-=0.08;out=c.toDataURL("image/jpeg",q);}
        res(out);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function loadAccounts(){
  try{
    const snap=await getDocs(query(collection(db,"accounts"),where("uid","==",CU.uid)));
    accounts=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    if(!accounts.length){
      const ref=await addDoc(collection(db,"accounts"),{uid:CU.uid,name:"Cuenta Principal",capital:0,riskPct:1,goal:{},createdAt:serverTimestamp()});
      accounts=[{id:ref.id,uid:CU.uid,name:"Cuenta Principal",capital:0,riskPct:1,goal:{}}];
    }
    if(!curAccId||!accounts.find(function(a){return a.id===curAccId;}))curAccId=accounts[0].id;
    renderAccBar();
    subTrades();
  }catch(e){
    console.warn("loadAccounts error:",e);
    subTrades();
  }
}

  for(var i=0;i<accounts.length;i++){

window.confirmDelAccount=function(id,name){
  if(accounts.length<=1){toast('No puedes borrar la unica cuenta','var(--red)');return;}
  if(!confirm('Borrar cuenta "'+name+'"?\n\nSe eliminaran todos sus trades.\nNo se puede deshacer.'))return;
  toast('Borrando...');
  getDocs(query(collection(db,'trades'),where('uid','==',CU.uid),where('accId','==',id))).then(function(snap){
    var dels=snap.docs.map(function(d){return deleteDoc(doc(db,'trades',d.id));});
    return Promise.all(dels);
  }).then(function(){
    return deleteDoc(doc(db,'accounts',id));
  }).then(function(){
    accounts=accounts.filter(function(a){return a.id!==id;});
    if(curAccId===id)curAccId=accounts[0]?accounts[0].id:null;
    toast('Cuenta eliminada','var(--red)');
    renderAccBar();subTrades();
  }).catch(function(e){toast('Error: '+e.message,'var(--red)');});
};

function subTrades(){
  if(unsub){unsub();unsub=null;}
  if(!curAccId)return render();
  const q=query(collection(db,"trades"),where("uid","==",CU.uid),where("accId","==",curAccId));
  unsub=onSnapshot(q,function(snap){
    trades=snap.docs.map(function(d){return Object.assign({},d.data(),{fid:d.id});});
    trades.sort(function(a,b){return(b.fecha||"").localeCompare(a.fecha||"");});
    render();
  },function(err){console.warn("Firestore:",err.message);render();});
}

async function saveTrade(data){
  const d=Object.assign({},data,{uid:CU.uid,accId:curAccId,updatedAt:serverTimestamp()});
  const fid=d.fid;delete d.fid;
  if(fid){await updateDoc(doc(db,"trades",fid),d);toast("Trade actualizado");}
  else{d.createdAt=serverTimestamp();await addDoc(collection(db,"trades"),d);toast("Guardado en la nube");}
}

    card+='<span class="chip '+((t.dir||"long").toLowerCase()==="long"?"cl":"cs")+'">'+( t.dir||"LONG")+'</span>';
    card+='<span class="tp">'+(t.par||"—")+'</span>';

window.exportCSV=function(){
  const h="Fecha,Par,Mercado,Direccion,Setup,Sesion,Entrada,SL,TP,P&L,R-Multiple,Emocion,Errores,Notas";
  const acc=curAcc();

    return[t.fecha,t.par,t.mercado,t.dir,t.setup,t.sesion,t.entrada,t.sl,t.tp,t.pnl,rM,t.emocion,(t.mistakes||[]).join("|"),'"'+(t.notas||"").replace(/"/g,'""')+'"'].join(",");
  });
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,\uFEFF"+encodeURIComponent([h,...r].join("\n"));
  a.download="sharks-"+((curAcc()||{}).name||"cuenta").replace(/\s/g,"-")+"-"+new Date().toISOString().split("T")[0]+".csv";

  if(!e||!e.clipboardData)return;
  const items=Array.from(e.clipboardData.items||[]);
  for(let i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')>=0){
      const file=items[i].getAsFile();
      if(file){toast("Pegando foto...");const c=await compressImg(file,350);addPhotoToRow(c);toast("Foto pegada!");}
    }
  }

window.pasteFromClipboard=async function(){
  try{
    const items=await navigator.clipboard.read();
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob=await item.getType(type);
          const file=new File([blob],'paste.png',{type});
          toast("Pegando...");
          const c=await compressImg(file,350);
          addPhotoToRow(c);
          toast("Foto pegada!");
          return;
        }
      }
    }
    toast("No hay imagen copiada","var(--gold)");
  }catch(e){toast("Ctrl+V en el area de fotos","var(--gold)");}
};
function addPhotoToRow(c){
  formPhotos.push(c);

    w.style="position:relative;flex-shrink:0";
    w.innerHTML='<img loading="lazy" src="'+c+'" class="pt" onclick="openLB(this.src)"/><button type="button" onclick="rmP('+idx+')" style="position:absolute;top:-6px;right:-6px;background:var(--red);border:none;border-radius:50%;color:#fff;cursor:pointer;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;line-height:1">x</button>';
    row.insertBefore(w,row.lastElementChild);
  }

      await saveTrade({fecha:(G('TF')&&G('TF').value)||selDay,pnl:pnl?Number(pnl):0,par,dir,mercado,sesion,setup,entrada:entrada?Number(entrada):0,sl:sl?Number(sl):0,tp:tp?Number(tp):0,emocion,notas,mistakes:[...selMistakes],photos:[...formPhotos],fid:editFid});

window.calcPos=function(){

  var entry=Number(G('PENTRY')&&G('PENTRY').value||0);
  var sl=Number(G('PSL')&&G('PSL').value||0);

  var risk=cap*(rp/100);
  var slDist=Math.abs(entry-sl);
  var slPct=slDist/entry*100;
  var size=risk/slDist;
  res.innerHTML='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +'<div><div style="color:var(--t3);font-size:7px;font-family:Cinzel,serif;letter-spacing:2px;margin-bottom:3px">RIESGO $</div><div style="font-family:Cinzel,serif;font-size:16px;font-weight:700;color:var(--red)">'+fS(risk)+'</div></div>'
    +'<div><div style="color:var(--t3);font-size:7px;font-family:Cinzel,serif;letter-spacing:2px;margin-bottom:3px">SL %</div><div style="font-family:Cinzel,serif;font-size:16px;font-weight:700;color:var(--gold2)">'+slPct.toFixed(2)+'%</div></div>'
    +'<div><div style="color:var(--t3);font-size:7px;font-family:Cinzel,serif;letter-spacing:2px;margin-bottom:3px">TAMANIO</div><div style="font-family:Cinzel,serif;font-size:16px;font-weight:700;color:var(--green)">'+size.toFixed(2)+'</div></div>'
    +'</div>';
};

window.addRule=async function(){
  var inp=G('RNEW');var txt=inp&&inp.value.trim();
  if(!txt)return;
  var acc=curAcc();if(!acc)return;
  var rules=(acc.rules||[]);rules.push(txt);
  await updateAccount(acc.id,{rules:rules});
  if(inp)inp.value='';toast('Regla agregada');render();
};

window.deleteRule=async function(i){
  var acc=curAcc();if(!acc)return;
  var rules=(acc.rules||[]);rules.splice(i,1);
  await updateAccount(acc.id,{rules:rules});toast('Regla eliminada');render();
};
</script>
</body>
</html>
