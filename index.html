<title>Sharks Asset Management</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080600;--bg2:#0d0a02;--card:#0f0c01;--gold:#c9a84c;--gold2:#f0c040;--gd:rgba(201,168,76,.1);--gb:rgba(201,168,76,.22);--green:#00e676;--grd:rgba(0,230,118,.1);--red:#ff3d5a;--rdd:rgba(255,61,90,.1);--t1:#f0e6c8;--t2:#a08840;--t3:#5a4820;--b2:#2a2000;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{color:var(--t1);font-family:Inter,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
input,select,textarea,button{font-family:Inter,sans-serif;outline:none;border:none;}
img{display:block;}
::-webkit-scrollbar{width:2px;}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes barW{from{width:0}to{width:100%}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(201,168,76,.25)}50%{box-shadow:0 0 50px rgba(201,168,76,.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gridMove{0%{transform:translateY(0)}100%{transform:translateY(60px)}}
.float{animation:float 4s ease-in-out infinite;}
.pulse{animation:pulse 2s ease infinite;}
.gold-text{background:linear-gradient(135deg,#8b6914,#f0c040,#c9a84c,#ffd700);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;}
.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.grid-bg::before{content:"";position:absolute;inset:-60px;background-image:linear-gradient(rgba(201,168,76,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.04) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 10s linear infinite;}
.grid-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.08),transparent 55%);}
.screen{position:fixed;inset:0;display:none;z-index:10;}
.screen.on{display:flex;}
#SL{background:#080600;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.sl-ring{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
.sl-ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(201,168,76,.15);}
.sl-ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold2);animation:spin 2.5s ease-in-out infinite;}
.sl-logo{width:108px;height:108px;border-radius:22px;animation:glow 2s ease-in-out infinite,float 4s ease-in-out infinite;}
.sl-bar{width:170px;height:1px;background:var(--b2);border-radius:1px;overflow:hidden;margin-top:24px;}
.sl-fill{height:100%;background:linear-gradient(90deg,transparent,var(--gold2),var(--gold),transparent);animation:barW 2.8s ease forwards;}
#SA{background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.07),transparent 50%),var(--bg);align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.ab{width:100%;max-width:420px;background:linear-gradient(160deg,#111000,#080600);border:1px solid var(--gb);border-radius:28px;padding:36px 28px;box-shadow:0 40px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,215,0,.06);animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;position:relative;overflow:hidden;}
.ab::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);}
.al{width:88px;height:88px;border-radius:20px;margin:0 auto 14px;display:block;animation:glow 3s ease-in-out infinite;}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--b2);border-radius:12px;color:var(--t1);font-size:14px;padding:13px 16px;width:100%;transition:all .3s;margin-bottom:10px;}
.inp:focus{border-color:var(--gold);background:rgba(201,168,76,.05);}
.inp::placeholder{color:var(--t3);}
.tabrow{display:flex;gap:3px;background:#120e03;border-radius:14px;padding:4px;margin-bottom:22px;border:1px solid var(--b2);}
.tabb{flex:1;border:none;background:transparent;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;padding:10px;transition:all .3s;color:var(--t3);}
.tabb.on{background:linear-gradient(135deg,#7a5c10,#c9a84c);color:#000;}
.abtn{background:linear-gradient(135deg,#7a5c10,#c9a84c,#f0c040);border:none;border-radius:14px;color:#000;cursor:pointer;font-weight:800;font-size:14px;padding:15px;width:100%;transition:all .3s;font-family:Cinzel,serif;letter-spacing:2px;box-shadow:0 8px 30px rgba(201,168,76,.3);}
.abtn:hover:not(:disabled){transform:translateY(-2px);}
.abtn:disabled{opacity:.5;cursor:not-allowed;}
.fgot{display:block;text-align:right;color:var(--gold);font-size:12px;cursor:pointer;margin-bottom:14px;margin-top:-4px;background:none;}
.amsg{border-radius:12px;font-size:13px;padding:11px 16px;margin-bottom:12px;display:none;}
.aerr{background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.3);color:#ff8a9a;}
.aok{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);color:var(--green);}
#APP{flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{height:calc(58px + var(--st));background:rgba(8,6,0,.97);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-bottom:1px solid var(--gb);padding:var(--st) 16px 0;flex-shrink:0;position:relative;}
.topbar::after{content:"";position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),transparent);}
.tbi{display:flex;align-items:center;justify-content:space-between;height:58px;}
.brand{display:flex;align-items:center;gap:10px;}
.bl{width:32px;height:32px;border-radius:8px;box-shadow:0 0 12px rgba(201,168,76,.3);}
.bn{font-family:Cinzel,serif;font-size:14px;font-weight:900;letter-spacing:2px;}
.bs{color:var(--t3);font-size:7px;letter-spacing:3px;display:block;margin-top:-1px;}
.tr2{display:flex;align-items:center;gap:8px;}
.aib{background:rgba(201,168,76,.1);border:1px solid var(--gb);border-radius:22px;color:var(--gold2);cursor:pointer;font-size:9px;font-weight:700;padding:7px 13px;font-family:Cinzel,serif;transition:all .25s;letter-spacing:1px;}
.aib:hover{background:rgba(201,168,76,.18);border-color:var(--gold);}
.uav{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7a5c10,#c9a84c);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#000;cursor:pointer;border:2px solid var(--gb);font-family:Cinzel,serif;}
.acb{padding:8px 16px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(201,168,76,.06);background:rgba(8,6,0,.7);flex-shrink:0;}
.acb::-webkit-scrollbar{display:none;}
.apill{flex-shrink:0;border-radius:22px 0 0 22px;cursor:pointer;font-size:9px;font-weight:700;padding:6px 8px 6px 14px;transition:all .25s;font-family:Cinzel,serif;border:1px solid var(--b2);background:rgba(255,255,255,.04);color:var(--t3);white-space:nowrap;}
.apill.on{background:linear-gradient(135deg,#7a5c10,#c9a84c);border-color:var(--gold);color:#000;}
.adelbtn{flex-shrink:0;border-radius:0 22px 22px 0;cursor:pointer;font-size:9px;padding:6px 8px;border:1px solid var(--b2);border-left:none;background:rgba(255,255,255,.04);color:var(--t3);}
.adelbtn.on{background:rgba(201,168,76,.3);border-color:var(--gold);color:#000;}

function dk(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fd(y,m){return new Date(y,m,1).getDay();}
function fS(n){const v=Number(n||0);return(v>=0?"$":"-$")+Math.abs(v).toFixed(2);}
function fP(n){return Number(n||0).toFixed(1)+"%";}
function tDay(k){return trades.filter(t=>t.fecha===k);}
function pDay(k){return tDay(k).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tMo(y,m){let a=[];for(let i=1;i<=dim(y,m);i++)a=a.concat(tDay(dk(y,m,i)));return a;}
function pMo(y,m){return tMo(y,m).reduce((s,t)=>s+Number(t.pnl||0),0);}
function tYr(y){let a=[];for(let m=0;m<12;m++)a=a.concat(tMo(y,m));return a;}
function last30(){const r=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d.getFullYear(),d.getMonth(),d.getDate());r.push({key:k,pnl:pDay(k),trs:tDay(k)});}return r;}

function calcS(arr){
  const t=arr.filter(x=>x.pnl!==undefined&&x.pnl!==null&&x.pnl!=="");
  if(!t.length)return{total:0,wins:0,losses:0,wr:0,pnl:0,avgW:0,avgL:0,rr:0,best:0,worst:0,pf:0,dd:0,exp:0,consec:0};
  const W=t.filter(x=>Number(x.pnl)>0),L=t.filter(x=>Number(x.pnl)<0);
  const pnl=t.reduce((s,x)=>s+Number(x.pnl),0);
  const gW=W.reduce((s,x)=>s+Number(x.pnl),0),gL=Math.abs(L.reduce((s,x)=>s+Number(x.pnl),0));
  const avgW=W.length?gW/W.length:0,avgL=L.length?gL/L.length:0;
  const wr=t.length?W.length/t.length:0,exp=(wr*avgW)-((1-wr)*avgL);
  let peak=0,dd=0,run=0,consec=0,cur=0;
  t.forEach(x=>{run+=Number(x.pnl);if(run>peak)peak=run;const dr=peak-run;if(dr>dd)dd=dr;if(Number(x.pnl)>0){cur=cur>=0?cur+1:1;}else{cur=cur<=0?cur-1:-1;}if(Math.abs(cur)>Math.abs(consec))consec=cur;});
  return{total:t.length,wins:W.length,losses:L.length,wr:wr*100,pnl,avgW,avgL,rr:avgL?avgW/avgL:0,best:Math.max(...t.map(x=>Number(x.pnl))),worst:Math.min(...t.map(x=>Number(x.pnl))),pf:gL?gW/gL:0,dd,exp,consec};
}

function mGoal(){const g=(curAcc()?.goal||{})[yr]||0;return g?Math.round(g/12*100)/100:0;}
function curAcc(){return accounts.find(a=>a.id===curAccId)||accounts[0]||null;}
function getRules(){try{const s=localStorage.getItem("sj_rules_"+(CU?.uid||"x"));return s?JSON.parse(s):DEFAULT_RULES;}catch{return DEFAULT_RULES;}}

function getTilt(){
  const r=trades.slice(0,10);if(!r.length)return{score:0,state:"Enfocado",color:"var(--green)",pct:0};
  const s=Math.min(10,(r.filter(t=>Number(t.pnl)<0).length*0.5)+(r.filter(t=>t.emocion==="revenge"||t.emocion==="fomo").length*1.5)+(r.filter(t=>t.mistakes&&t.mistakes.length>0).length*0.8));
  if(s<=2)return{score:s,state:"Enfocado",color:"var(--green)",pct:s*10};
  if(s<=5)return{score:s,state:"Precaucion",color:"var(--gold)",pct:s*10};
  if(s<=8)return{score:s,state:"En Tilt",color:"#ff9800",pct:s*10};
  return{score:s,state:"PARA YA",color:"var(--red)",pct:100};
}

function compressImg(file,maxKB){
  maxKB=maxKB||350;
  return new Promise(function(res){
    const r=new FileReader();
    r.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const c=document.createElement("canvas");
        let w=img.width,h=img.height,m=1400;
        if(w>m||h>m){if(w>h){h=Math.round(h*m/w);w=m;}else{w=Math.round(w*m/h);h=m;}}
        c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.85,out=c.toDataURL("image/jpeg",q);
        while(out.length>maxKB*1024&&q>0.3){q-=0.08;out=c.toDataURL("image/jpeg",q);}
        res(out);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function loadAccounts(){
  try{
    const snap=await getDocs(query(collection(db,"accounts"),where("uid","==",CU.uid)));
    accounts=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});
    if(!accounts.length){
      const ref=await addDoc(collection(db,"accounts"),{uid:CU.uid,name:"Cuenta Principal",capital:0,riskPct:1,goal:{},createdAt:serverTimestamp()});
      accounts=[{id:ref.id,uid:CU.uid,name:"Cuenta Principal",capital:0,riskPct:1,goal:{}}];
    }
    if(!curAccId||!accounts.find(function(a){return a.id===curAccId;}))curAccId=accounts[0].id;
    renderAccBar();
    subTrades();
  }catch(e){
    console.warn("loadAccounts error:",e);
    subTrades();
  }
}

async function updateAccount(id,data){
  await updateDoc(doc(db,"accounts",id),data);
  const i=accounts.findIndex(function(a){return a.id===id;});
  if(i>=0)accounts[i]=Object.assign({},accounts[i],data);
}

function renderAccBar(){
  var w=G("ACBW");if(!w)return;
  var h='<div class="acb">';
  for(var i=0;i<accounts.length;i++){
    var a=accounts[i];
    var on=a.id===curAccId;
    var cls=on?'apill on':'apill';
    var dcls=on?'adelbtn on':'adelbtn';
    h+='<div style="display:flex;align-items:center;flex-shrink:0">';
    h+='<button class="'+cls+'" data-id="'+a.id+'" onclick="doSwitch(this)">'+a.name+'</button>';
    h+='<button class="'+dcls+'" data-id="'+a.id+'" data-nm="'+a.name.replace(/['"]/g,'')+'" onclick="doDel(this)">x</button>';

  }
  h+='<button class="aadd" onclick="openAddAccount()">+ Cuenta</button></div>';

window.confirmDelAccount=function(id,name){
  if(accounts.length<=1){toast('No puedes borrar la unica cuenta','var(--red)');return;}
  if(!confirm('Borrar cuenta "'+name+'"?\n\nSe eliminaran todos sus trades.\nNo se puede deshacer.'))return;
  toast('Borrando...');
  getDocs(query(collection(db,'trades'),where('uid','==',CU.uid),where('accId','==',id))).then(function(snap){
    var dels=snap.docs.map(function(d){return deleteDoc(doc(db,'trades',d.id));});
    return Promise.all(dels);
  }).then(function(){
    return deleteDoc(doc(db,'accounts',id));
  }).then(function(){
    accounts=accounts.filter(function(a){return a.id!==id;});
    if(curAccId===id)curAccId=accounts[0]?accounts[0].id:null;
    toast('Cuenta eliminada','var(--red)');
    renderAccBar();subTrades();
  }).catch(function(e){toast('Error: '+e.message,'var(--red)');});
};

function subTrades(){
  if(unsub){unsub();unsub=null;}
  if(!curAccId)return render();
  const q=query(collection(db,"trades"),where("uid","==",CU.uid),where("accId","==",curAccId));
  unsub=onSnapshot(q,function(snap){
    trades=snap.docs.map(function(d){return Object.assign({},d.data(),{fid:d.id});});
    trades.sort(function(a,b){return(b.fecha||"").localeCompare(a.fecha||"");});
    render();
  },function(err){console.warn("Firestore:",err.message);render();});
}

async function saveTrade(data){
  const d=Object.assign({},data,{uid:CU.uid,accId:curAccId,updatedAt:serverTimestamp()});
  const fid=d.fid;delete d.fid;
  if(fid){await updateDoc(doc(db,"trades",fid),d);toast("Trade actualizado");}
  else{d.createdAt=serverTimestamp();await addDoc(collection(db,"trades"),d);toast("Guardado en la nube");}
}

async function delTrade(fid){await deleteDoc(doc(db,"trades",fid));toast("Eliminado","var(--red)");}

// CALENDAR
function buildCal(){
  const acc=curAcc(),yts=tYr(yr),ys=calcS(yts),yp=yts.reduce(function(s,t){return s+Number(t.pnl||0);},0);
  const yg=(acc&&acc.goal?acc.goal:{})[yr]||0,gp=yg?Math.min(yp/yg*100,100):0,mg=mGoal(),tilt=getTilt();
  let body=view==="year"?buildYrV():view==="month"?buildMoV():build30V();

  let phases="";
  if(yg){
    let phg="";
    for(let m=0;m<12;m++){
      const mp=pMo(yr,m),isDone=mg>0&&mp>=mg,isCur=m===mo&&yr===NOW.getFullYear(),pct=mg?Math.min(mp/mg*100,100):0;
      phg+='<div class="ph'+(isDone?" done":"")+(isCur&&!isDone?" cur":"")+'" onclick="goMo('+m+')">';
      if(isDone)phg+='<div class="phc">✓</div>';
      phg+='<div class="phm">'+MOS[m]+'</div>';
      phg+='<div class="pha" style="color:'+(mp>=0?"var(--green)":"var(--red)")+';">'+(mp>=0?"+":"")+Math.abs(mp).toFixed(0)+'</div>';
      phg+='<div class="phb"><div class="phf" style="width:'+pct+'%;background:'+(isDone?"var(--green)":isCur?"var(--gold)":"var(--b2)")+'"></div></div></div>';
    }
    phases='<div class="phw"><div class="pht">FASES '+fS(yg)+'/ANO = '+fS(mg)+'/MES</div><div class="phg">'+phg+'</div></div>';
  }else{
    phases='<div style="padding:0 16px 10px;"><button onclick="openGoalM()" style="width:100%;background:none;border:1px dashed var(--gb);border-radius:10px;color:var(--t3);cursor:pointer;font-size:9px;padding:9px;font-family:Cinzel,serif;letter-spacing:2px;">+ FIJAR META ANUAL '+yr+'</button></div>';
  }

  let html='<div class="vt">';
  [["30days","30 Dias"],["month","Mes"],["year","Ano"]].forEach(function(vl){
    html+='<button class="vb'+(view===vl[0]?" on":"")+'" onclick="setView(\''+vl[0]+'\')" >'+vl[1]+'</button>';
  });
  html+='</div>';
  html+='<div class="banner"><div class="bl2">'+(acc?acc.name:"Cuenta")+' · '+(view==="year"?"ANO "+yr:view==="month"?MOSF[mo].slice(0,3).toUpperCase()+" "+yr:"30 DIAS")+'</div>';
  html+='<div class="bp" style="color:'+(yp>=0?"var(--green)":"var(--red)")+'">'+fS(yp)+'</div>';
  if(acc&&acc.initialCapital){
    var bal=acc.initialCapital+yp;
    html+='<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,168,76,.1)">';
    html+='<span style="color:var(--t3);font-size:9px;font-family:Cinzel,serif;letter-spacing:2px">BALANCE</span>';
    html+='<span style="font-family:Cinzel,serif;font-size:18px;font-weight:700;color:'+(bal>=acc.initialCapital?"var(--green)":"var(--red)")+'" >'+fS(bal)+'</span>';
    html+="</div>";
  }
  if(yg){
    html+='<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:8px;margin-bottom:3px;"><span style="color:var(--t3);font-size:8px;font-family:Cinzel,serif;letter-spacing:2px;">META '+yr+'</span><span style="color:var(--gold2);">'+fS(yp)+' / '+fS(yg)+' · '+gp.toFixed(0)+'%</span></div>';
    html+='<div class="gt"><div class="gf" style="width:'+gp+'%"></div></div>';
  }
  html+='<div class="bst"><div class="bss"><div class="bsv" style="color:'+(ys.wr>=50?"var(--green)":"var(--gold)")+'">'+ys.wr.toFixed(0)+'%</div><div class="bsl">Win Rate</div></div><div class="bss"><div class="bsv">'+ys.total+'</div><div class="bsl">Trades</div></div><div class="bss"><div class="bsv" style="color:'+(ys.rr>=1.5?"var(--green)":ys.rr>=1?"var(--gold)":"var(--red)")+'">'+ys.rr.toFixed(2)+'</div><div class="bsl">R/R</div></div></div></div>';
  html+='<div class="tlt" style="background:'+tilt.color+'10;border-color:'+tilt.color+'40;">';
  html+='<div><div style="color:var(--t3);font-size:8px;letter-spacing:3px;font-family:Cinzel,serif;margin-bottom:3px;">TILTMETER</div><div style="font-family:Cinzel,serif;font-size:15px;font-weight:700;color:'+tilt.color+'">'+tilt.state+'</div><div style="width:120px;height:5px;background:var(--b2);border-radius:3px;overflow:hidden;margin-top:5px;"><div style="height:100%;background:'+tilt.color+';width:'+tilt.pct+'%;border-radius:3px;"></div></div></div>';
  html+='<div style="text-align:right;"><div style="font-family:Cinzel,serif;font-size:26px;font-weight:900;color:'+tilt.color+'">'+tilt.score.toFixed(1)+'</div><div style="color:var(--t3);font-size:8px;letter-spacing:2px;">/ 10</div></div></div>';
  html+=phases+body;
  return html;
}

function buildYrV(){
  let cards="";
  for(let m=0;m<12;m++){
    const days=dim(yr,m),first=fd(yr,m),mp=pMo(yr,m),has=tMo(yr,m).length>0;
    let dots='<div class="dt de"></div>'.repeat(first);
    for(let i=1;i<=days;i++){const p=pDay(dk(yr,m,i)),h=tDay(dk(yr,m,i)).length>0;dots+='<div class="dt '+(h?(p>0?"dw":"dl"):"de")+'"></div>';}
    cards+='<div class="mc" onclick="goMo('+m+')"><div class="mn">'+MOS[m]+'</div><div class="dg">'+dots+'</div><div class="mp" style="color:'+(!has?"var(--t3)":mp>=0?"var(--green)":"var(--red)")+'">'+(!has?"—":fS(mp))+'</div></div>';
  }
  return'<div class="nr"><button class="nb2" onclick="chYr(-1)">&#9664;</button><span class="nl">'+yr+'</span><button class="nb2" onclick="chYr(1)">&#9654;</button></div><div class="yg" style="margin-top:8px">'+cards+'</div>';
}

function buildMoV(){
  const days=dim(yr,mo),first=fd(yr,mo);
  let cells='<div class="cd cde"></div>'.repeat(first);
  for(let i=1;i<=days;i++){
    const k=dk(yr,mo,i),p=pDay(k),h=tDay(k).length>0,isT=k===TODAY;

// STATS
function buildSta(){
  const ys=calcS(tYr(yr)),ds=calcS(last30().flatMap(function(d){return d.trs;}));
  const sorted=[...trades].sort(function(a,b){return(a.fecha||"").localeCompare(b.fecha||"");});
  const eq=[0];sorted.forEach(function(t){eq.push(eq[eq.length-1]+Number(t.pnl||0));});
  const minE=Math.min(...eq),maxE=Math.max(...eq),rng=maxE-minE||1;
  const pts=eq.map(function(v,i){return(i/(eq.length-1||1)*300)+","+(100-((v-minE)/rng)*90);}).join(" ");
  const setupS={},sesS={},mktS={},mstS={};
  trades.forEach(function(t){
    if(t.setup){if(!setupS[t.setup])setupS[t.setup]={n:0,p:0,w:0};setupS[t.setup].n++;setupS[t.setup].p+=Number(t.pnl||0);if(Number(t.pnl)>0)setupS[t.setup].w++;}
    if(t.sesion){if(!sesS[t.sesion])sesS[t.sesion]={n:0,p:0};sesS[t.sesion].n++;sesS[t.sesion].p+=Number(t.pnl||0);}
    if(t.mercado){if(!mktS[t.mercado])mktS[t.mercado]={n:0,p:0,w:0};mktS[t.mercado].n++;mktS[t.mercado].p+=Number(t.pnl||0);if(Number(t.pnl)>0)mktS[t.mercado].w++;}
    if(t.mistakes)t.mistakes.forEach(function(m){if(!mstS[m])mstS[m]=0;mstS[m]++;});
  });
  const bS=Object.entries(setupS).sort(function(a,b){return b[1].p-a[1].p;})[0];
  const wS=Object.entries(setupS).sort(function(a,b){return a[1].p-b[1].p;})[0];
  const bSes=Object.entries(sesS).sort(function(a,b){return b[1].p-a[1].p;})[0];
  const bM=Object.entries(mktS).sort(function(a,b){return b[1].p-a[1].p;})[0];

    html+='<polygon points="0,100 '+pts+' '+(eq.length-1)/(eq.length-1||1)*300+',100" fill="url(#eg)"/>';
    html+='<polyline points="'+pts+'" fill="none" stroke="'+(ys.pnl>=0?"#00e676":"#ff3d5a")+'" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg>';
    html+='<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-top:5px;font-family:\'Space Mono\',monospace"><span>MIN: '+fS(minE)+'</span><span>MAX: '+fS(maxE)+'</span></div></div>';
  }
  html+=sR("ANO "+yr,[["P&L TOTAL",fS(ys.pnl),ys.pnl>=0?"var(--green)":"var(--red)"],["WIN RATE",fP(ys.wr),ys.wr>=50?"var(--green)":"var(--gold)"],["TRADES",ys.total,"var(--t1)"],["R/R",ys.rr.toFixed(2),ys.rr>=1.5?"var(--green)":ys.rr>=1?"var(--gold)":"var(--red)"],["MEJOR",fS(ys.best),"var(--green)"],["PEOR",fS(ys.worst),"var(--red)"],["AVG WIN",fS(ys.avgW),"var(--green)"],["AVG LOSS",fS(ys.avgL),"var(--red)"],["PROFIT F.",ys.pf.toFixed(2),ys.pf>=1.5?"var(--green)":ys.pf>=1?"var(--gold)":"var(--red)"],["EXPECTANCY",fS(ys.exp),ys.exp>=0?"var(--green)":"var(--red)"],["MAX DD",fS(ys.dd),"var(--red)"],["RACHA",ys.consec>0?"+"+ys.consec+"W":ys.consec+"L",ys.consec>0?"var(--green)":"var(--red)"]]);
  if(bS||bSes||bM){
    html+='<div class="stt">EDGE ANALYSIS</div><div style="padding:0 16px;display:flex;flex-direction:column;gap:7px;margin-bottom:10px">';

    if(bM)html+='<div class="edgec"><div class="al2" style="margin-bottom:4px">MEJOR MERCADO</div><div style="font-family:Cinzel,serif;font-size:15px;font-weight:700;color:var(--gold2)">'+bM[0]+'</div><div style="color:var(--t3);font-size:10px;margin-top:2px">'+bM[1].n+' trades · '+fS(bM[1].p)+'</div></div>';
    html+='</div>';
  }
  if(topM.length){

    topM.forEach(function(item){html+='<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b2)"><span style="color:var(--t2);font-size:12px">⚠ '+item[0]+'</span><span style="font-family:Cinzel,serif;font-size:12px;color:var(--red);font-weight:700">'+item[1]+'x</span></div>';});
    html+='</div>';
  }
  html+=sR("30 DIAS",[["P&L",fS(ds.pnl),ds.pnl>=0?"var(--green)":"var(--red)"],["WIN RATE",fP(ds.wr),ds.wr>=50?"var(--green)":"var(--gold)"],["TRADES",ds.total,"var(--t1)"],["R/R",ds.rr.toFixed(2),ds.rr>=1.5?"var(--green)":ds.rr>=1?"var(--gold)":"var(--red)"],["EXPECTANCY",fS(ds.exp),ds.exp>=0?"var(--green)":"var(--red)"],["MAX DD",fS(ds.dd),"var(--red)"]]);

window.pasteFromClipboard=async function(){
  try{
    const items=await navigator.clipboard.read();
    for(const item of items){
      for(const type of item.types){
        if(type.startsWith('image/')){
          const blob=await item.getType(type);

window.sendQuick=function(q){var inp=G('CHATINP');if(inp)inp.value=q;sendChat();};

window.sendChat=async function(){
  var inp=G('CHATINP');
  var msg=inp&&inp.value.trim();
  if(!msg)return;
  var k=localStorage.getItem('sj_ai')||'';
  var prov=localStorage.getItem('sj_aip')||'claude';
  if(!k){toast('Configura tu API Key en CONFIG','var(--gold)');return;}
  if(inp)inp.value='';

  chatHistory.push({role:'user',content:msg});
  window.renderChat&&window.renderChat();

  var acc=curAcc(),ys=calcS(tYr(yr)),tilt=getTilt();
  var last5=trades.slice(0,5).map(function(t){return t.fecha+' '+t.par+' '+(t.dir||'')+' $'+Number(t.pnl||0).toFixed(2);}).join(', ');
  var ctx='DATOS DEL TRADER:\nNombre: '+(CU&&CU.displayName||'Trader')+'\nCuenta: '+(acc&&acc.name||'')+' | Capital: $'+(acc&&acc.capital||0)+' | Riesgo: '+(acc&&acc.riskPct||1)+'%\nAno '+yr+': '+ys.total+' trades | WR: '+ys.wr.toFixed(1)+'% | P&L: $'+ys.pnl.toFixed(2)+' | R/R: '+ys.rr.toFixed(2)+' | PF: '+ys.pf.toFixed(2)+'\nTiltmeter: '+tilt.state+' ('+tilt.score.toFixed(1)+'/10)\nUltimos trades: '+last5+'\n\n';
  var sys='Eres el mentor personal de trading. '+ctx+'Responde en espanol, directo y personalizado usando sus datos reales.';

  chatHistory.push({role:'assistant',content:'...'});
  window.renderChat&&window.renderChat();

  var result='';
  try{
    if(prov==='groq'){
      var res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'llama-3.3-70b-versatile',max_tokens:600,messages:[{role:'system',content:sys},{role:'user',content:msg}]})});
      var d=await res.json();result=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'Error.';if(d.error)result='Error Groq: '+d.error.message;
    }else if(prov==='claude'){
      var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:sys,messages:[{role:'user',content:msg}]})});
      var d=await res.json();result=(d.content&&d.content[0]&&d.content[0].text)||'Error.';if(d.error)result='Error Claude: '+d.error.message;
    }else if(prov==='chatgpt'){
      var res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'gpt-4o',max_tokens:600,messages:[{role:'system',content:sys},{role:'user',content:msg}]})});
      var d=await res.json();result=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'Error.';if(d.error)result='Error ChatGPT: '+d.error.message;
    }else if(prov==='gemini'){
      var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sys+'\n\nUsuario: '+msg}]}],generationConfig:{maxOutputTokens:600}})});
      var d=await res.json();result=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text)||'Error.';if(d.error)result='Error Gemini: '+d.error.message;
    }
  }catch(e){result='Error de conexion. Verifica tu internet.';}

  chatHistory[chatHistory.length-1]={role:'assistant',content:result};
  window.renderChat&&window.renderChat();
};



</script>
